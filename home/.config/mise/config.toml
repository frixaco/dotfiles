# `mise up` updates everything here. Language servers sit next to their runtimes.
[tools]
node = 'lts'
go = 'latest'
bun = 'latest'
deno = 'latest'
uv = 'latest'
zig = 'latest'
# Route Cargo through the shared build cache and keep its language server in sync.
rust = { version = 'latest', mr_boxington = true, components = ['rust-analyzer'] }
mr-boxington = 'latest'

# CLI tools, same on macOS and Windows.
bat = 'latest'
delta = 'latest'
difftastic = 'latest'
dua = 'latest'
fd = 'latest'
fzf = 'latest'
gh = 'latest'
hunk = 'latest'
hyperfine = 'latest'
jj = 'latest'
jjui = 'latest'
jq = 'latest'
lazygit = 'latest'
railway = 'latest'
ripgrep = 'latest'
starship = 'latest'
tree-sitter = 'latest'
yazi = 'latest'
zoxide = 'latest'
"npm:agent-browser" = 'latest'

# Language servers, formatters, and linters.
lua-language-server = 'latest'
stylua = 'latest'
"github:wgsl-analyzer/wgsl-analyzer" = { version = 'latest', matching = 'wgsl-analyzer-', bin = 'wgsl-analyzer' }
"go:golang.org/x/tools/gopls" = 'latest'
"go:golang.org/x/tools/cmd/goimports" = 'latest'
ruff = 'latest'
ty = 'latest'
"pipx:clang-format" = 'latest'
shfmt = 'latest'
shellcheck = 'latest'
taplo = 'latest'
"npm:@astrojs/language-server" = 'latest'
"npm:@olrtg/emmet-language-server" = 'latest'
"npm:@tailwindcss/language-server" = 'latest'
"npm:@typescript/native-preview" = { version = 'latest', prerelease = true }
"npm:typescript-language-server" = 'latest'
"npm:vscode-langservers-extracted" = 'latest'
"npm:graphql-language-service-cli" = 'latest'
"npm:eslint" = 'latest'
"npm:oxlint" = 'latest'
"npm:oxfmt" = 'latest'
"npm:prettier" = 'latest'

# Standalone installers; each one installs or upgrades in place.
[tasks."ai:install"]
description = "Install or update AI coding agents"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"

if command -v amp >/dev/null; then amp update; else curl -fsSL https://ampcode.com/install.sh | bash; fi
if command -v claude >/dev/null; then claude update; else curl -fsSL https://claude.ai/install.sh | bash; fi
curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path

# A first PI install asks for one keypress when a terminal is attached.
if [ -f "$HOME/.pi/agent/install/current-version" ]; then
  pi update --all
else
  curl -fsSL https://pi.dev/install.sh | sh
  pi update --extensions
fi

# Without --binary, the OMP installer prefers a global Bun install.
if [ -x "$HOME/.local/bin/omp" ]; then omp update; else curl -fsSL https://omp.sh/install | sh -s -- --binary; fi
'''
run_windows = "mise run ai:install:windows"

[tasks."ai:install:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
function Invoke-Native([scriptblock]$Command) {
  & $Command
  if ($LASTEXITCODE) { throw "Command failed: $Command" }
}

if (Get-Command amp -ErrorAction SilentlyContinue) { Invoke-Native { amp update } } else { irm https://ampcode.com/install.ps1 | iex }

$claude = Join-Path $HOME ".local\bin\claude.exe"
if (Test-Path -LiteralPath $claude) { Invoke-Native { & $claude update } } else { irm https://claude.ai/install.ps1 | iex }

$env:CODEX_NON_INTERACTIVE = "1"
irm https://chatgpt.com/codex/install.ps1 | iex

# OpenCode V2 has no Windows standalone installer yet.
Invoke-Native { bun install -g --trust @opencode/cli@latest }

# A first PI install asks for one keypress when a terminal is attached.
$pi = Join-Path $HOME ".pi\agent\bin\pi.cmd"
if (Test-Path -LiteralPath (Join-Path $HOME ".pi\agent\install\current-version")) {
  Invoke-Native { & $pi update --all }
} else {
  # install.ps1 finishes the install, then throws refreshing PATH under `irm | iex`.
  # Tolerate that, but still fail if the binary never appeared.
  try { irm https://pi.dev/install.ps1 | iex } catch { if (-not (Test-Path -LiteralPath $pi)) { throw } }
  Invoke-Native { & $pi update --extensions }
}

# Without -Binary, the OMP installer prefers a global Bun install.
$omp = Join-Path $env:LOCALAPPDATA "omp\omp.exe"
if (Test-Path -LiteralPath $omp) { Invoke-Native { & $omp update } } else { & ([scriptblock]::Create((irm https://omp.sh/install.ps1))) -Binary }
'''

[tasks."ai:doctor"]
description = "Check AI agent binaries on PATH"
run = '''
#!/usr/bin/env bash
export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
missing=0
for bin in amp claude opencode codex pi omp; do
  if path="$(command -v "$bin")"; then echo "$bin -> $path"; else echo "$bin -> NOT FOUND" >&2; missing=1; fi
done
exit "$missing"
'''
run_windows = "mise run ai:doctor:windows"

[tasks."ai:doctor:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
# Fresh installs are not on this session's PATH yet.
$env:Path = @(
  (Join-Path $HOME ".local\bin"), (Join-Path $HOME ".amp\bin"), (Join-Path $HOME ".bun\bin"),
  (Join-Path $HOME ".pi\agent\bin"), (Join-Path $env:LOCALAPPDATA "Programs\OpenAI\Codex\bin"),
  (Join-Path $env:LOCALAPPDATA "omp"), $env:Path
) -join ";"
$missing = @("amp", "claude", "opencode", "codex", "pi", "omp") | Where-Object {
  $cmd = Get-Command $_ -ErrorAction SilentlyContinue
  Write-Host "$_ ->$(if ($cmd) { $cmd.Source } else { 'NOT FOUND' })"
  -not $cmd
}
if ($missing) { throw "Missing AI agents: $($missing -join ', ')" }
'''

# Never push history on its own, even after `mise dot origin set`: older
# checkpoints recorded these app-written files as shared.
[settings]
history.sync = "manual"

# Tracking must be declared globally so the watcher sees it from any directory.
# App-written settings: local history only, never shared. Repo-owned keys in
# Amp and Codex are merged in by the dotfiles repo's mise.toml.
[dotfiles]
"~/.config/amp/settings.json" = { mode = "track-local" }
"~/.config/btop/btop.conf" = { mode = "track-local" }
"~/.config/opencode/cli.json" = { mode = "track-local" }
"~/.omp/agent/config.yml" = { mode = "track-local" }
"~/.codex/config.toml" = { mode = "track-local" }
"~/.pi/agent/settings.json" = { mode = "track-local" }
"~/.claude/settings.json" = { mode = "track-local" }

[bootstrap.services.mise-history]
builtin = "history-watch"
