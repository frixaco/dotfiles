[tools]
node = 'lts'
go = 'latest'
bun = 'latest'
deno = 'latest'
uv = 'latest'
zig = 'latest'
# Route Cargo through the shared build cache and keep its language server in sync.
rust = { version = 'latest', mr_boxington = true, components = ['rust-analyzer'] }
mr-boxington = 'latest'
lua-language-server = 'latest'
"github:wgsl-analyzer/wgsl-analyzer" = { version = 'latest', matching = 'wgsl-analyzer-', bin = 'wgsl-analyzer' }

[tasks."lsp:install"]
description = "Install LSP tools (mise + go + uv)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mise install

bun pm cache rm -g
bun install -g \
  @astrojs/language-server@latest \
  @johnnymorganz/stylua-bin@latest \
  @olrtg/emmet-language-server@latest \
  @tailwindcss/language-server@latest \
  @taplo/cli@latest \
  @typescript/native-preview@beta \
  eslint@latest \
  graphql-language-service-cli@latest \
  oxfmt@latest \
  oxlint@latest \
  prettier@latest \
  shellcheck@latest \
  svelte-language-server@latest \
  typescript-language-server@latest \
  vscode-langservers-extracted@latest

go install golang.org/x/tools/gopls@latest
go install golang.org/x/tools/cmd/goimports@latest
go install mvdan.cc/sh/v3/cmd/shfmt@latest
uv tool install --upgrade ruff
uv tool install --upgrade ty
uv tool install --upgrade clang-format
'''
run_windows = [
  "mise install",
  "bun install -g @astrojs/language-server@latest @johnnymorganz/stylua-bin@latest @olrtg/emmet-language-server@latest @tailwindcss/language-server@latest @taplo/cli@latest @typescript/native-preview@beta eslint@latest graphql-language-service-cli@latest oxfmt@latest oxlint@latest prettier@latest shellcheck@latest svelte-language-server@latest typescript-language-server@latest vscode-langservers-extracted@latest",
  "go install golang.org/x/tools/gopls@latest",
  "go install golang.org/x/tools/cmd/goimports@latest",
  "go install mvdan.cc/sh/v3/cmd/shfmt@latest",
  "uv tool install --upgrade ruff",
  "uv tool install --upgrade ty",
  "uv tool install --upgrade clang-format",
]

[tasks."lsp:doctor"]
description = "Check LSP binaries on PATH"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bins=(
  lua-language-server
  wgsl-analyzer
  graphql-lsp
  svelteserver
  clangd
  rust-analyzer
  gopls
  goimports
  stylua
  clang-format
  ruff
  ty
  emmet-language-server
  vscode-eslint-language-server
  vscode-html-language-server
  vscode-css-language-server
  tailwindcss-language-server
  typescript-language-server
  tsgo
  astro-ls
  oxfmt
  oxlint
  taplo
  shfmt
  shellcheck
  prettier
  eslint
)
for bin in "${bins[@]}"; do
  if path="$(command -v "$bin")"; then
    printf "%s -> %s\n" "$bin" "$path"
  else
    printf "%s -> NOT FOUND\n" "$bin" >&2
    exit 1
  fi
done
'''
run_windows = [
  "where lua-language-server",
  "where wgsl-analyzer",
  "where graphql-lsp",
  "where svelteserver",
  "where clangd",
  "where rust-analyzer",
  "where gopls",
  "where goimports",
  "where stylua",
  "where clang-format",
  "where ruff",
  "where ty",
  "where emmet-language-server",
  "where vscode-eslint-language-server",
  "where vscode-html-language-server",
  "where vscode-css-language-server",
  "where tailwindcss-language-server",
  "where typescript-language-server",
  "where tsgo",
  "where astro-ls",
  "where oxfmt",
  "where oxlint",
  "where taplo",
  "where shfmt",
  "where shellcheck",
  "where prettier",
  "where eslint",
]

[tasks."lsp:sync"]
description = "Install then verify LSP stack"
run = [
  { task = "lsp:install" },
  { task = "lsp:doctor" },
]

[tasks."ai:install"]
description = "Install/update AI coding agents"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Standalone installers use these directories; check them before PATH reloads.
export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"

if ! command -v amp &> /dev/null; then
    curl -fsSL https://ampcode.com/install.sh | bash
fi


mise install

# Codex, PI, OMP, and OpenCode use standalone installs; remove old global packages.
for pkg in @openai/codex @earendil-works/pi-coding-agent @oh-my-pi/pi-coding-agent opencode-ai; do
  if [ -e "$HOME/.bun/install/global/node_modules/$pkg" ]; then
    bun remove -g "$pkg"
  fi
done

bun pm cache rm -g
bun install -g agent-browser@latest

# Claude Code also updates itself in the background.
if [ -x "$HOME/.local/bin/claude" ]; then
  claude update
else
  curl -fsSL https://claude.ai/install.sh | bash
fi

# The Codex installer upgrades an existing standalone install in place.
curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh

# A first PI install asks for one keypress when a terminal is attached.
if [ -f "$HOME/.pi/agent/install/current-version" ]; then
  pi update --all
else
  curl -fsSL https://pi.dev/install.sh | sh
  pi update --extensions
fi

# The V2 installer replaces V1 in ~/.opencode/bin and adds the opencode2 shim.
if [ -x "$HOME/.opencode/bin/opencode2" ]; then
  opencode upgrade
else
  curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
fi

# Without --binary, the OMP installer prefers a global Bun install.
if [ -x "$HOME/.local/bin/omp" ]; then
  omp update
else
  curl -fsSL https://omp.sh/install | sh -s -- --binary
fi

amp update
curl -fsSL https://raw.githubusercontent.com/dmtrKovalenko/fff.nvim/main/install-mcp.sh | bash
'''
run_windows = "mise run ai:install:windows"

[tasks."ai:install:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
function Invoke-Native([scriptblock]$Command) {
  & $Command
  if ($LASTEXITCODE) { throw "Command failed: $Command" }
}

if (Get-Command amp -ErrorAction SilentlyContinue) {
  Invoke-Native { amp update }
} else {
  irm https://ampcode.com/install.ps1 | iex
}

Invoke-Native { mise install }

# Codex, PI, and OMP use standalone installs; OpenCode V2 uses its Bun package.
$globalModules = Join-Path $HOME ".bun\install\global\node_modules"
foreach ($pkg in @("@openai/codex", "@earendil-works/pi-coding-agent", "@oh-my-pi/pi-coding-agent", "opencode-ai")) {
  if (Test-Path -LiteralPath (Join-Path $globalModules $pkg)) {
    Invoke-Native { bun remove -g $pkg }
  }
}

Invoke-Native { bun pm cache rm -g }
Invoke-Native { bun install -g agent-browser@latest }
Invoke-Native { bun install -g --trust @opencode/cli@latest }

# Claude Code also updates itself in the background.
$claude = Join-Path $HOME ".local\bin\claude.exe"
if (Test-Path -LiteralPath $claude) {
  Invoke-Native { & $claude update }
} else {
  irm https://claude.ai/install.ps1 | iex
}

# The Codex installer upgrades an existing standalone install in place.
$env:CODEX_NON_INTERACTIVE = "1"
irm https://chatgpt.com/codex/install.ps1 | iex

# A first PI install asks for one keypress when a terminal is attached.
$pi = Join-Path $HOME ".pi\agent\bin\pi.cmd"
if (Test-Path -LiteralPath (Join-Path $HOME ".pi\agent\install\current-version")) {
  Invoke-Native { & $pi update --all }
} else {
  irm https://pi.dev/install.ps1 | iex
  Invoke-Native { & $pi update --extensions }
}

# Without -Binary, the OMP installer prefers a global Bun install.
$omp = Join-Path $env:LOCALAPPDATA "omp\omp.exe"
if (Test-Path -LiteralPath $omp) {
  Invoke-Native { & $omp update }
} else {
  & ([scriptblock]::Create((irm https://omp.sh/install.ps1))) -Binary
}

irm https://raw.githubusercontent.com/dmtrKovalenko/fff.nvim/main/install-mcp.ps1 | iex
'''

[tasks."ai:link"]
description = "Configure the Codex browser MCP"
run = "codex mcp add chrome-devtools -- npx -y chrome-devtools-mcp@latest --no-usage-statistics --browserUrl http://127.0.0.1:9222"

[tasks."ai:doctor"]
description = "Check AI agent binaries on PATH"
run = '''
#!/usr/bin/env bash
bins=(amp claude opencode codex pi omp)
missing=0
for bin in "${bins[@]}"; do
  if path="$(command -v "$bin" 2>/dev/null)"; then
    printf "%s -> %s\n" "$bin" "$path"
  else
    printf "%s -> NOT FOUND\n" "$bin" >&2
    missing=1
  fi
done
exit "$missing"
'''
run_windows = "mise run ai:doctor:windows"

[tasks."ai:doctor:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$paths = @(
  (Join-Path $HOME ".amp\bin"),
  (Join-Path $HOME ".local\bin"),
  (Join-Path $HOME ".bun\bin"),
  (Join-Path $HOME ".pi\agent\bin"),
  (Join-Path $env:LOCALAPPDATA "Programs\OpenAI\Codex\bin"),
  (Join-Path $env:LOCALAPPDATA "omp"),
  (Join-Path $env:LOCALAPPDATA "fff-mcp\bin")
)
$env:Path = (($paths + ($env:Path -split ";")) | Where-Object { $_ } | Select-Object -Unique) -join ";"

foreach ($bin in @("amp", "claude", "opencode", "codex", "pi", "omp")) {
  $cmd = Get-Command $bin -ErrorAction SilentlyContinue
  if ($cmd) {
    Write-Output "$bin -> $($cmd.Source)"
  } else {
    Write-Output "$bin -> NOT FOUND"
    $missing += $bin
  }
}
if ($missing) { throw "Missing AI agents: $($missing -join ', ')" }
'''

[tasks."ai:sync"]
description = "Install agents, configure Codex MCP, and verify binaries"
run = [
  { task = "ai:install" },
  { task = "ai:link" },
  { task = "ai:doctor" },
]

# Tracking must be declared globally so the watcher sees it from any directory.
[settings]
experimental = true
history.sync = "manual"

# App-written settings stay live and machine-local. Repo-owned files use Git.
[dotfiles]
"~/.config/amp/settings.json" = { mode = "track" }
"~/.config/btop/btop.conf" = { mode = "track" }
"~/.config/opencode/cli.json" = { mode = "track" }
"~/.omp/agent/config.yml" = { mode = "track" }
"~/.codex/config.toml" = { mode = "track" }
"~/.pi/agent/settings.json" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"
