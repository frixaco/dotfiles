min_version = "2026.7.6"

[settings]
experimental = true
dotfiles.root = "~/.dotfiles/home"

# Default machine profile. Override per-machine in mise.local.toml (gitignored),
# e.g. `[vars]\nwork = true` plus any machine-specific [dotfiles] entries.
[vars]
work = false

# AeroSpace's tap lacks the metadata required by mise, so macOS casks stay in Homebrew.
[bootstrap.hooks.pre-packages]
run = '''
if [ "$(uname -s)" = "Darwin" ] && [ ! -x /opt/homebrew/bin/brew ]; then
  NONINTERACTIVE=1 /bin/bash -c \
    "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
'''

[bootstrap.brew.taps]
"modem-dev/tap" = "https://github.com/modem-dev/homebrew-tap.git"

[bootstrap.packages]
"brew:bat" = "latest"
"brew:ccache" = "latest"
"brew:cmake" = "latest"
"brew:curl" = "latest"
"brew:difftastic" = "latest"
"brew:dua-cli" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:fish" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-lfs" = "latest"
"brew:hyperfine" = "latest"
"brew:imagemagick-full" = "latest"
"brew:jj" = "latest"
"brew:jjui" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:modem-dev/tap/hunk" = "latest"
"brew:poppler" = "latest"
"brew:postgresql@18" = "latest"
"brew:railway" = "latest"
"brew:resvg" = "latest"
"brew:ripgrep" = "latest"
"brew:sevenzip" = "latest"
"brew:starship" = "latest"
"brew:tokei" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:yazi" = "latest"
"brew:zoxide" = "latest"

[bootstrap.hooks.post-packages]
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  /opt/homebrew/bin/brew bundle --file "$PWD/Brewfile.macos"
fi
'''

[bootstrap.hooks.pre-dotfiles]
run = "mise run layout"

[bootstrap.hooks.post-dotfiles]
run = "mise run secure"

# Deploy dotfiles with `mise dotfiles apply` (see setup.sh). Sources resolve
# under dotfiles.root. Secrets use `copy` + `mise run secure` (git can't keep
# 0600); OS/work-specific files use `template` (Tera).
[dotfiles]
# OS/work-specific (rendered templates)
"~/.zshrc" = { mode = "template" }
"~/.gitconfig" = { mode = "template" }
"~/.config/fish/config.fish" = { mode = "template" }
"~/.config/ghostty/config" = { mode = "template" }
"~/.config/1Password/ssh/agent.toml" = { mode = "template" }
"~/stuff/code/vbrato/.gitconfig-vbrato" = { mode = "template" }

# Tool-rewritten config (real files)
"~/.config/amp/settings.json" = { mode = "copy" }
"~/.config/btop/btop.conf" = { mode = "copy" }
"~/.config/opencode/tui.json" = { mode = "copy" }
"~/.config/mise/config.toml" = { mode = "copy" }
"~/.omp/agent/config.yml" = { mode = "copy" }

# Plain files (symlink)
"~/.config/nvim/init.lua" = { mode = "symlink" }
"~/.config/nvim/lua" = { mode = "symlink" }
"~/.config/nvim/stylua.toml" = { mode = "symlink" }
"~/.config/aerospace/aerospace.toml" = { mode = "symlink" }
"~/.config/fish/conf.d/00-mise.fish" = { mode = "symlink" }
"~/.config/fish/themes/cyberdream.theme" = { mode = "symlink" }
"~/.config/ghostty/themes/cyberdream" = { mode = "symlink" }
"~/.config/kitty/kitty.conf" = { mode = "symlink" }
"~/.config/kitty/cyberdream.conf" = { mode = "symlink" }
"~/.config/btop/themes/cyberdream.theme" = { mode = "symlink" }
"~/.config/bat/config" = { mode = "symlink" }
"~/.config/bat/themes/cyberdream.tmTheme" = { mode = "symlink" }
"~/.config/delta/themes/cyberdream.gitconfig" = { mode = "symlink" }
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/jjui/config.toml" = { mode = "symlink" }
"~/.config/jjui/themes/cyberdream-dark.toml" = { mode = "symlink" }
"~/.config/lazygit/config.yml" = { mode = "symlink" }
"~/.config/opencode/opencode.json" = { mode = "symlink" }
"~/.config/opencode/themes/cyberdream.json" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }
"~/.config/yazi/init.lua" = { mode = "symlink" }
"~/.config/yazi/theme.toml" = { mode = "symlink" }
"~/.config/yazi/yazi.toml" = { mode = "symlink" }
"~/.config/yazi/flavors/cyberdream.yazi/flavor.toml" = { mode = "symlink" }
"~/.config/AGENTS.md" = { mode = "symlink" }
"~/.omp/agent/mcp.json" = { source = "~/.dotfiles/home/.pi/agent/mcp.json", mode = "symlink" }
"~/.pi/agent/mcp.json" = { mode = "symlink" }
"~/.pi/agent/settings.json" = { mode = "symlink" }

[tasks.layout]
description = "Create the shared personal workspace"
run = '''
mkdir -p \
  "$HOME/stuff/code" \
  "$HOME/stuff/music" \
  "$HOME/stuff/2d" \
  "$HOME/stuff/3d" \
  "$HOME/stuff/dump"
'''
run_windows = "mise run layout:windows"

[tasks."layout:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
@("code", "music", "2d", "3d", "dump") | ForEach-Object {
  New-Item -ItemType Directory -Force -Path (Join-Path $HOME "stuff\$_") | Out-Null
}
'''

[tasks.secure]
description = "Restrict permissions on sensitive dotfiles to 0600"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for f in \
  home/.config/1Password/ssh/agent.toml \
  ~/.config/1Password/ssh/agent.toml; do
  [ -f "$f" ] && chmod 600 "$f"
done
'''
run_windows = "mise run secure:windows"

[tasks."secure:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
$identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
$files = @(
  (Join-Path $PWD "home\.config\1Password\ssh\agent.toml"),
  (Join-Path $HOME ".config\1Password\ssh\agent.toml")
)
foreach ($file in $files) {
  if (Test-Path -LiteralPath $file) {
    & icacls.exe $file /inheritance:r /grant:r "${identity}:(M)" | Out-Null
    if ($LASTEXITCODE -ne 0) { throw "Could not restrict permissions on $file" }
  }
}
'''

[tasks.sync]
description = "Create workspace directories, apply dotfiles, then fix sensitive permissions"
run = [{ task = "layout" }, "mise dotfiles apply --yes", { task = "secure" }]

[tasks.bootstrap]
description = "Install and verify AI agents and language servers"
run = ["mise run ai:sync", "mise run lsp:sync"]
