min_version = "2026.10.7"

[settings]
dotfiles.root = "~/.dotfiles/home"

# Default machine profile. Override per-machine in mise.local.toml (gitignored).
# Work machines also deploy the vbrato git identity that ~/.gitconfig includes:
#   [vars]
#   work = true
#   [dotfiles]
#   "~/stuff/code/vbrato/.gitconfig-vbrato" = { source = "home/stuff/code/vbrato/.gitconfig-vbrato", mode = "template" }
[vars]
work = false

# Platform extras. mise installs formulae and casks itself; Homebrew is optional.
# Cross-platform CLI tools live in [tools] of the global config instead.
[bootstrap.packages]
# No upstream macOS binaries for these, so brew on macOS and Scoop on Windows.
"brew:eza" = "latest"
"brew:tokei" = "latest"
"brew:resvg" = "latest"
"scoop:eza" = "latest"
"scoop:tokei" = "latest"
"scoop:resvg" = "latest"
"brew:ccache" = "latest"
"brew:cmake" = "latest"
"brew:curl" = "latest"
"brew:ffmpeg" = "latest"
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-lfs" = "latest"
"brew:imagemagick-full" = "latest"
"brew:mpv" = "latest"
"brew:poppler" = "latest"
"brew:postgresql@18" = "latest"
"brew:mole" = { os = "macos" }
# TODO: kitty and Ghostty use "Paper Mono" (installed by hand); install it here or switch the configs to this font.
"brew-cask:font-blex-mono-nerd-font" = { os = "unix" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:keycastr" = { os = "macos" }
"brew-cask:kitty" = { os = "macos" }
"brew-cask:macpacker" = { os = "macos" }
"brew-cask:orbstack" = { os = "macos" }
"brew-cask:zulu@17" = { os = "macos" }

[bootstrap.hooks]
post-dotfiles = "{% if os() == 'windows' %}mise run powershell:profile{% else %}true{% endif %}"

# Everything in home/ mirrors into ~ (copies on Windows). Entries below are cut
# out of that walk automatically; their sources resolve under dotfiles.root.
[dotfile_groups.home]
root = "."
exclude = [
  "/.claude/settings.json",              # reference snapshot; the live file is tracked
  "/.claude.json",                       # merge source below
  "/.config/amp/settings.json",          # merge sources below
  "/.codex/config.toml",
  "/.config/powershell/profile.ps1",     # Windows loads it straight from the repo
  "/stuff/code/vbrato/.gitconfig-vbrato", # work only: mise.local.toml deploys it
]

[dotfile_groups.home.entries]
"~/.zshrc" = { source = ".zshrc", mode = "template", variants = [{ os = "unix" }] }
"~/.gitconfig" = { mode = "template" }
"~/.config/fish/config.fish" = { mode = "template" }
"~/.config/ghostty/config" = { mode = "template" }
"~/.config/1Password/ssh/agent.toml" = { mode = "template", permissions = "0600", variants = [
  { os = "windows", target = "~/AppData/Local/1Password/config/ssh/agent.toml" },
  { default = true },
] }

# One AGENTS.md and one MCP config shared by every agent.
"~/.codex/AGENTS.md" = { source = ".config/AGENTS.md" }
"~/.claude/CLAUDE.md" = { source = ".config/AGENTS.md" }
"~/.config/opencode/AGENTS.md" = { source = ".config/AGENTS.md" }
"~/.config/amp/AGENTS.md" = { source = ".config/AGENTS.md" }
"~/.pi/agent/AGENTS.md" = { source = ".config/AGENTS.md" }
"~/.omp/agent/AGENTS.md" = { source = ".config/AGENTS.md" }
"~/.pi/agent/mcp.json" = {}
"~/.omp/agent/mcp.json" = { source = ".pi/agent/mcp.json" }

# Apps rewrite these files; mise owns only the keys in the repo copy.
[dotfiles]
"~/.claude.json/mcp" = { merge = true }  # user-scope MCP servers only
"~/.config/amp/settings.json/shared" = { merge = true }
"~/.codex/config.toml/shared" = { merge = true }

[tasks.layout]
description = "Create the shared personal workspace"
run = "mkdir -p ~/stuff/code ~/stuff/music ~/stuff/2d ~/stuff/3d ~/stuff/dump"
run_windows = 'pwsh -NoProfile -Command "New-Item -ItemType Directory -Force -Path ~/stuff/code,~/stuff/music,~/stuff/2d,~/stuff/3d,~/stuff/dump | Out-Null"'

[tasks."powershell:profile"]
description = "Point the native PowerShell profile at the repo profile"
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
New-Item -ItemType Directory -Force -Path (Split-Path $PROFILE.CurrentUserAllHosts) | Out-Null
Set-Content -LiteralPath $PROFILE.CurrentUserAllHosts -Value '. "$HOME\.dotfiles\home\.config\powershell\profile.ps1"' -Encoding utf8
'''

[tasks.sync]
description = "Apply dotfiles, remove ones no longer in the repo, start history, check"
run = [
  "mise bootstrap dotfiles apply --force --prune --yes",
  "mise bootstrap services apply --yes",
  "mise bootstrap dotfiles status --missing",
]

[tasks.up]
description = "Sync dotfiles, then update mise, packages, tools, and agents; keeps going after failures"
run = '''
#!/usr/bin/env bash
failed=()
for step in "mise run sync" "mise self-update --yes" "mise bootstrap packages upgrade --yes" \
    "mise upgrade --yes" "mise run ai:install"; do
  printf '\n==> %s\n' "$step"
  $step
  status=$?
  # Stop if the user interrupts; otherwise note the failure and continue.
  case $status in 0) ;; 130|143) exit "$status" ;; *) failed+=("$step") ;; esac
done
if [ -n "${failed[*]}" ]; then printf '\nFailed: %s\n' "${failed[@]}" >&2; exit 1; fi
'''
run_windows = "mise run up:windows"

# Scoop can't update mise while it runs, so upall updates Scoop and mise first.
[tasks."up:windows"]
hide = true
shell = "pwsh -NoProfile -Command"
run = '''
$failed = @()
foreach ($step in @("mise run sync", "mise bootstrap packages upgrade --yes", "mise upgrade --yes", "mise run ai:install")) {
  Write-Host "`n==> $step"
  $command, $commandArgs = $step -split " "
  & $command @commandArgs
  if ($LASTEXITCODE -in @(130, -1073741510)) { exit $LASTEXITCODE }
  if ($LASTEXITCODE) { $failed += $step }
}
if ($failed) { Write-Error "Failed: $($failed -join ', ')"; exit 1 }
'''

# Runs last in `mise bootstrap`, after packages, dotfiles, and [tools].
[tasks.bootstrap]
description = "Create the workspace, then install and verify AI agents"
run = [{ task = "layout" }, { task = "ai:install" }, { task = "ai:doctor" }]
